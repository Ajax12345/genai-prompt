<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructor Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body>
  <header class="ribbon">
    <div class="ribbon__inner">
      <p class="ribbon__eyebrow">Brandeis University Computer Science Department</p>
      <h1 class="ribbon__title">Instructor Login</h1>
      <!--
      <p class="ribbon__subtitle">Sign in to manage your courses, assignments, and submissions.</p>
    -->
    </div>
  </header>

  <main class="page page--narrow">
    <div class="card">
      <a class="google-btn" href="/login/google">
        <svg class="google-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2582h2.9087c1.7018-1.5668 2.6836-3.8741 2.6836-6.6151z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2582c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.0359-3.7104H.9573v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
          <path fill="#FBBC05" d="M3.9641 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2822-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.9641 10.71z"/>
          <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4404 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.9641 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/>
        </svg>
        Sign in with Google
      </a>

      <div class="auth-divider"><span>or sign in with email</span></div>

      <form id="login-form" novalidate>

        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input
            class="field__input"
            type="email"
            id="email"
            name="email"
            placeholder="you@brandeis.edu"
            autocomplete="username"
            required
          />
          <p class="field__error" id="email-error"></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Password</label>
          <input
            class="field__input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <p class="field__error" id="password-error"></p>
        </div>

        <div class="submit-row submit-row--stacked">
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <button class="submit-btn submit-btn--full" type="submit" id="login-btn">
            <span class="submit-btn__label">Sign in</span>
          </button>
        </div>
      </form>
    </div>

    <p class="footnote">
      If you have trouble logging in, please email James (jamespetullo@brandeis.edu)
    </p>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">
      &copy; <span id="current-year">2026</span> Brandeis University, Computer Science Department.
    </p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
